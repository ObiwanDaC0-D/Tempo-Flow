<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tempo Flow diagnostics</title><style>body{font:16px system-ui;background:#101923;color:#e8f7f6;max-width:650px;margin:35px auto;padding:20px}li{margin:10px 0}.ok{color:#75e7b9}.bad{color:#ffadad}</style><h1>Tempo Flow diagnostics</h1><p>Static checks only. Hardware testing requires Bluefy and the H10.</p><ol id="results"></ol><script>
const out=document.getElementById('results');function check(name,pass,detail=''){let li=document.createElement('li');li.className=pass?'ok':'bad';li.textContent=(pass?'PASS: ':'FAIL: ')+name+(detail?' — '+detail:'');out.append(li)}
(async()=>{try{let html=await(await fetch('./index.html',{cache:'no-store'})).text(),doc=new DOMParser().parseFromString(html,'text/html'),script=doc.querySelector('script')?.textContent||'';try{new Function(script);check('JavaScript syntax',true)}catch(e){check('JavaScript syntax',false,e.message)}for(let id of ['clock','start','lap','reset','planrows','connect','demo','trend','analysisChart','analysisSession','storageStatus'])check('Element #'+id,!!doc.getElementById(id));check('IndexedDB integration',script.includes('indexedDB.open'));check('Bluetooth reconnection',script.includes('scheduleReconnect'));check('Heart rate notifications',script.includes('startNotifications'));check('Simulated data labeling',script.includes('DEMO'));check('CSV export',script.includes('function csv'))}catch(e){check('Load application',false,e.message)}})();
</script>
